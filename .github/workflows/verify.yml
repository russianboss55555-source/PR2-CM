name: Verify PR2
on: [push]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Graphviz
        run: |
          command -v dot || (sudo apt-get update && sudo apt-get install -y graphviz)
      - name: Test the CLI
        run: python3 -m unittest discover -s tests -v
      - name: Compare real packages with Cargo
        run: python3 demo/compare_cargo.py
      - name: Read crates.io reverse dependencies API
        run: python3 demo/reverse_real.py
      - name: Visualize a larger real package
        run: |
          python3 demo/stage5.py
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as element_tree
          from pathlib import Path
          dot = Path("out/image.dot").read_text()
          nodes = re.findall(r'^  "([^"]+)";$', dot, re.MULTILINE)
          edges = re.findall(r'^  "([^"]+)" -> "([^"]+)";$', dot, re.MULTILINE)
          assert len(nodes) >= 10, len(nodes)
          assert len(edges) >= 10, len(edges)
          element_tree.parse("out/image.svg")
          print(f"image graph: {len(nodes)} vertices, {len(edges)} edges")
          PY
